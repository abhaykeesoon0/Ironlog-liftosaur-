# Builds the app the way a clean clone does: no local.properties, no
# keystore.properties, no Firebase key. app/build.gradle.kts reads both
# property files with takeIf { it.exists() }, so without them no release
# signing config is created (the debug APK built here is signed with the
# SDK's debug key, as always) and FIREBASE_WEB_API_KEY is an empty string
# (verification off). The Android SDK comes from ANDROID_HOME, which the
# ubuntu-latest runner sets, so no sdk.dir is needed either.
name: Android CI

on:
  push:
    branches:
      - main
      - kotlin-upgrade
  pull_request:
    branches:
      - main
      - kotlin-upgrade
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Pull requests read the cache but do not write to it, so the
          # cache for a branch is only ever filled by pushes to that branch.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The wrapper script is tracked without the executable bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      # No lint {} block in app/build.gradle.kts, so AGP defaults apply:
      # errors fail the task, warnings do not.
      - name: Run Android lint
        run: ./gradlew --no-daemon --console=plain lintDebug

      # ABI splits are on, so this produces one APK per CPU type plus the
      # universal one.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Upload debug APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: liftosaur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload unit test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
