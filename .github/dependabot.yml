# Weekly dependency update pull requests: Gradle dependencies and plugins from
# gradle/libs.versions.toml, and the actions pinned in .github/workflows.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
